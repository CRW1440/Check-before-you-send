<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Check Before You Send</title><link rel="stylesheet" href="/styles.css"></head><body><main><header><h1>Check Before You Send</h1><p>Review evidence and risk indicators before sending crypto.</p></header><section class="card"><h2>Check a website</h2><input id="url" placeholder="https://example.com"><button onclick="websiteCheck()">Check website</button><div id="website"></div></section><section class="card"><h2>Check Bitcoin</h2><select id="btcType"><option value="address">Bitcoin address</option><option value="transaction">Transaction ID</option></select><input id="btc" placeholder="Paste address or transaction ID"><button onclick="bitcoinCheck()">Check Bitcoin</button><div id="btcResult"></div></section><section class="card"><h2>Combined report</h2><input id="cUrl" placeholder="Website URL (optional)"><input id="cAddress" placeholder="Bitcoin address (optional)"><input id="cTx" placeholder="Transaction ID (optional)"><button onclick="combined()">Generate report</button><pre id="report"></pre></section><footer>Informational risk analysis only. Never enter a seed phrase, private key, or wallet password.</footer></main><script src="/app.js"></script></body></html>
